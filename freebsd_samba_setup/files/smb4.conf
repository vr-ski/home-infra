[global]
    server min protocol = SMB3_11
    server max protocol = SMB3_11
    workgroup = WORKGROUP
    server string = FreeBSD Samba Jail (%v)
    netbios name = TRUENAS
    security = user
    map to guest = Never
    guest account = nobody
    load printers = no
    printcap name = /dev/null
    disable spoolss = yes
    log file = /var/log/samba4/log.%m
    max log size = 50000
    logging = file
    log level = 3
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
    read raw = yes
    write raw = yes
    use sendfile = yes
    kernel oplocks = no
    #veto files = /._*/.DS_Store/.AppleDouble/.Trashes/
    #delete veto files = yes

    # Time machine support (optional)
    # fruit:model = MacSamba
    # fruit:advertise_fullsync = true

    # Allow only specific interfaces – replace with your jail’s IP
    interfaces = 127.0.0.1 192.168.2.0/24
    bind interfaces only = yes

[archive]
    comment = Archive
    path = /mnt/archive
    valid users = smb_user
    read only = no
    browseable = yes
    create mask = 0660
    directory mask = 0770
    force group = media
    force user = media
    vfs objects = zfsacl
    nfs4:chown = yes
    acl allow execute always = yes

